
name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          test -f project.zip
          mkdir -p source
          unzip -q project.zip -d source

          PACKAGE_FILE="$(find source -type f -name package.json -print -quit)"
          test -n "$PACKAGE_FILE"

          PROJECT_DIR="$(dirname "$PACKAGE_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          test -f "$PROJECT_DIR/public/faris/index.html"
          echo "Project extracted successfully."

      - name: Prepare npm
        run: |
          npm install --global npm@10.9.2
          npm cache clean --force

      - name: Install dependencies
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps --no-audit --no-fund \
              || npm install --legacy-peer-deps --no-audit --no-fund
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi

      - name: Build web project
        run: |
          set -e
          cd "$PROJECT_DIR"
          npm run build

      - name: Configure Android and app icon
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          npm install @capacitor/core @capacitor/android \
            --legacy-peer-deps --no-audit --no-fund

          npm install --save-dev @capacitor/cli @capacitor/assets \
            --legacy-peer-deps --no-audit --no-fund

          mkdir -p resources

          if [ -f resources/icon.png ]; then
            echo "App icon found."
          else
            echo "WARNING: resources/icon.png not found."
            echo "Default Android icon may be used."
          fi

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          fs.writeFileSync(
            'capacitor.config.json',
            JSON.stringify({
              appId: 'com.storesync.billing',
              appName: 'محاسب فارس الزعزعي',
              webDir: 'public/faris'
            }, null, 2)
          );
          NODE

          if [ ! -d android ]; then
            npx cap add android
          fi

          if [ -f resources/icon.png ]; then
            npx capacitor-assets generate --android
          fi

          npx cap sync android

      - name: Build Android APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Faris-Accounting-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
